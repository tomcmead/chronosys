services:
  # Development Environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    privileged: true
    pid: host
    volumes:
      - .:/app
      - /app/target
      - /sys/kernel/debug:/sys/kernel/debug:ro
    environment:
      - RUST_LOG=debug

  # Release Test Environment
  release:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    privileged: true
    pid: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
    environment:
      - RUST_LOG=info